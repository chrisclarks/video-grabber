<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    width: 360px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: #1e1e1e;
    color: #eee;
  }
  header {
    padding: 12px 14px;
    background: #d6336c;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #count { font-weight: 400; font-size: 12px; opacity: 0.9; }
  #list { max-height: 420px; overflow-y: auto; }
  .item {
    padding: 10px 14px;
    border-bottom: 1px solid #333;
  }
  .item .name {
    word-break: break-all;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .badge.direct { background: #2b8a3e; color: #fff; }
  .badge.hls, .badge.dash { background: #e8590c; color: #fff; }
  button {
    border: none;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    background: #d6336c;
    color: #fff;
  }
  button.secondary { background: #444; }
  button:hover { opacity: 0.9; }
  .hint {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
    line-height: 1.4;
  }
  .cmd {
    margin-top: 6px;
    background: #000;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10.5px;
    color: #6fcf97;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 90px;
    overflow-y: auto;
    user-select: all;
  }
  .cmd-actions { margin-top: 6px; }
  .section-label {
    padding: 8px 14px 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #e8590c;
    font-weight: 600;
  }
  .vitem { padding: 10px 14px; border-bottom: 1px solid #333; }
  .vitem .vid { font-size: 12px; color: #ccc; margin-bottom: 6px; }
  #empty { padding: 20px 14px; color: #aaa; text-align: center; line-height: 1.5; }
  footer { padding: 8px 14px; border-top: 1px solid #333; display: flex; justify-content: space-between; }
  footer button { background: #333; }
  code { background: #000; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <span>Video Grabber</span>
    <span id="count"></span>
  </header>
  <div id="vimeo"></div>
  <div id="list"></div>
  <div id="empty">
    No videos detected yet.<br />
    Start playing a video on this tab, then reopen this popup.<br /><br />
    For Vimeo embeds, the video must start playing so the player loads.
  </div>
  <footer>
    <button id="refresh" class="secondary">Refresh</button>
    <button id="clear" class="secondary">Clear</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
